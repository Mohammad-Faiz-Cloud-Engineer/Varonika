[project]
name = "varonika"
version = "0.1.0"
description = "Varonika Voice Assistant"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.0.0",
    "openwakeword>=0.5.1",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "PyAudio>=0.2.14",
    "agent-client-protocol>=0.9.0",
    "pyyaml>=6.0.1",
    "kokoro>=0.9.4",
    "pywhispercpp>=1.5.0",
    "keyboard>=0.13.5",
    "qasync>=0.27.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
